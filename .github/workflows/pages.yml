# Publishes the game to GitHub Pages. A PWA can only be installed from
# https, so this is what makes "Add to Home Screen" work on real phones.
#
# One-time setup: repository Settings -> Pages -> Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    # The default branch is currently the feature branch below; `main` is
    # listed too so this keeps working if the project is later merged or
    # renamed there.
    branches:
      - main
      - claude/pet-rock-simulator-app-19toml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        # Turns Pages on via the API if it has never been enabled, so the
        # site can go live without anyone visiting the settings screen.
        # Harmless once it is already on.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
